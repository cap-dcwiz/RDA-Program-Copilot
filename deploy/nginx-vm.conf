server {
    listen 8091;
    listen [::]:8091;
    server_name _;

    root /var/www/rda-program-copilot;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
